  <script>
    // Crossfade the background pictures every few seconds.
    const slides = document.querySelectorAll('.slide');
    let i = 0;
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
      setInterval(() => {
        slides[i].classList.remove('show');
        i = (i + 1) % slides.length;
        slides[i].classList.add('show');
      }, 6000);
    }

    // Background song from YouTube, with a now-playing box in the corner.
    // Browsers block sound until the visitor interacts, so it starts on the first click or key press.
    const np = document.getElementById('np');
    const npState = document.getElementById('np-state');
    const toggle = document.getElementById('np-toggle');
    let player, ready = false, wantPlay = true;

    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);

    window.onYouTubeIframeAPIReady = () => {
      player = new YT.Player('yt', {
        width: 200, height: 113,
        videoId: 'Bc9xCCx8fJU',
        playerVars: { autoplay: 1, controls: 0, loop: 1, playlist: 'Bc9xCCx8fJU', playsinline: 1 },
        events: {
          onReady: () => { ready = true; player.setVolume(40); player.playVideo(); },
          onStateChange: e => {
            const playing = e.data === YT.PlayerState.PLAYING;
            np.classList.toggle('playing', playing);
            toggle.setAttribute('aria-label', playing ? 'Pause music' : 'Play music');
            npState.textContent = playing ? 'Now playing' : (wantPlay ? 'Click to play' : 'Paused');
          }
        }
      });
    };

    function startOnFirstInput(e) {
      if (!ready || !wantPlay) return;
      if (e.target.closest && e.target.closest('#np-toggle')) return;
      if (player.getPlayerState() !== YT.PlayerState.PLAYING) player.playVideo();
    }
    addEventListener('pointerdown', startOnFirstInput, { once: true, capture: true });
    addEventListener('keydown', startOnFirstInput, { once: true, capture: true });

    toggle.addEventListener('click', () => {
      if (!ready) return;
      if (player.getPlayerState() === YT.PlayerState.PLAYING) { wantPlay = false; player.pauseVideo(); }
      else { wantPlay = true; player.playVideo(); }
    });
  </script>
