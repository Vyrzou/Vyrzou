          <svg class="i-mute" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9zm12.6 3 2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4z"/></svg>

  <script>
    // Crossfade the background pictures every few seconds.
    const slides = document.querySelectorAll('.slide');
    let i = 0;
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
      setInterval(() => {
        slides[i].classList.remove('show');
        i = (i + 1) % slides.length;
        slides[i].classList.add('show');
      }, 6000);
    }

    // Background song from YouTube, with a now-playing box in the corner.
    // It starts paused; visitors press play in the box.
    // DEFAULT_VOLUME is what new visitors hear (0-100). Visitors can change it with the slider.
    const DEFAULT_VOLUME = 40;
    const VIDEO = 'Bc9xCCx8fJU';

    const np = document.getElementById('np');
    const npState = document.getElementById('np-state');
    const toggle = document.getElementById('np-toggle');
    const slider = document.getElementById('np-volume');
    const muteBtn = document.getElementById('np-mute');
    let player, ready = false, wantPlay = false, muted = false;

    let volume = DEFAULT_VOLUME;
    try { const v = localStorage.getItem('vyrzou-volume'); if (v !== null) volume = +v; } catch (e) {}
    slider.value = volume;
    paintSlider();

    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);

    window.onYouTubeIframeAPIReady = () => {
      player = new YT.Player('yt', {
        width: 200, height: 113,
        videoId: VIDEO,
        playerVars: { autoplay: 0, controls: 0, loop: 1, playlist: VIDEO, playsinline: 1 },
        events: {
          onReady: () => { ready = true; applyVolume(); update(); },
          onStateChange: update,
          onError: () => { npState.textContent = 'Can\'t play here'; }
        }
      });
    };


    function applyVolume() {
      if (!ready) return;
      player.setVolume(volume);
      if (muted || volume === 0) player.mute(); else player.unMute();
    }

    function update() {
      if (!ready) return;
      const playing = player.getPlayerState() === YT.PlayerState.PLAYING;
      const silent = player.isMuted();
      np.classList.toggle('playing', playing);
      np.classList.toggle('muted', muted || volume === 0);
      toggle.setAttribute('aria-label', playing ? 'Pause music' : 'Play music');
      if (playing && silent && !muted && volume > 0) npState.textContent = 'Click to unmute';
      else npState.textContent = playing ? 'Now playing' : 'Paused';
    }

    function paintSlider() {
      slider.style.setProperty('--fill', slider.value + '%');
    }

    toggle.addEventListener('click', () => {
      if (!ready) return;
      if (player.getPlayerState() === YT.PlayerState.PLAYING && !player.isMuted()) {
        wantPlay = false; player.pauseVideo();
      } else {
        wantPlay = true; applyVolume(); player.playVideo();
      }
      setTimeout(update, 300);
    });

    slider.addEventListener('input', () => {
      volume = +slider.value;
      muted = false;
      paintSlider();
      try { localStorage.setItem('vyrzou-volume', volume); } catch (e) {}
      applyVolume();
      if (ready && wantPlay && player.getPlayerState() !== YT.PlayerState.PLAYING) player.playVideo();
      update();
    });

    muteBtn.addEventListener('click', () => {
      muted = !(muted || volume === 0);
      if (!muted && volume === 0) { volume = DEFAULT_VOLUME; slider.value = volume; paintSlider(); }
      muteBtn.setAttribute('aria-label', muted ? 'Unmute' : 'Mute');
      applyVolume();
      if (!muted && ready && wantPlay && player.getPlayerState() !== YT.PlayerState.PLAYING) player.playVideo();
      update();
    });

    // Fade the art in as it scrolls into view.
    const io = new IntersectionObserver(entries => {
      for (const e of entries) if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
    }, { threshold: 0.15 });
    document.querySelectorAll('.reveal').forEach(el => io.observe(el));

    // Click a picture to see it big. Esc or clicking outside closes; arrow keys switch.
    const lb = document.getElementById('lightbox');
    const lbImg = document.getElementById('lb-img');
    const arts = [...document.querySelectorAll('.gallery img')];
    let current = 0, lastFocus = null;

    function openArt(i) {
      current = (i + arts.length) % arts.length;
      lbImg.src = arts[current].src;
      lbImg.alt = arts[current].alt;
      if (lb.hidden) {
        lastFocus = document.activeElement;
        lb.hidden = false;
        requestAnimationFrame(() => lb.classList.add('open'));
        document.body.style.overflow = 'hidden';
        document.getElementById('lb-close').focus();
      }
    }
    function closeArt() {
      lb.classList.remove('open');
      document.body.style.overflow = '';
      setTimeout(() => { lb.hidden = true; }, 250);
      if (lastFocus) lastFocus.focus();
    }

    arts.forEach((img, i) => {
      img.tabIndex = 0;
      img.setAttribute('role', 'button');
      img.addEventListener('click', () => openArt(i));
      img.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openArt(i); } });
    });
    lb.addEventListener('click', e => { if (e.target === lb) closeArt(); });
    document.getElementById('lb-close').addEventListener('click', closeArt);
    document.getElementById('lb-prev').addEventListener('click', () => openArt(current - 1));
    document.getElementById('lb-next').addEventListener('click', () => openArt(current + 1));
    addEventListener('keydown', e => {
      if (lb.hidden) return;
      if (e.key === 'Escape') closeArt();
      else if (e.key === 'ArrowLeft') openArt(current - 1);
      else if (e.key === 'ArrowRight') openArt(current + 1);
    });

    // One scroll (wheel, keys or the arrows) glides between the hub and the art.
    const hub = document.getElementById('top');
    const artSec = document.getElementById('art');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let gliding = false;

    function glideTo(y) {
      if (gliding) return;
      const start = scrollY, dist = y - start;
      if (Math.abs(dist) < 2) return;
      if (reduce) { scrollTo(0, y); return; }
      gliding = true;
      const dur = 650, t0 = performance.now();
      const ease = t => 1 - Math.pow(1 - t, 4);   // fast start, soft landing
      (function step(now) {
        const t = Math.min(1, (now - t0) / dur);
        scrollTo(0, start + dist * ease(t));
        if (t < 1) requestAnimationFrame(step);
        else setTimeout(() => { gliding = false; }, 120);
      })(t0);
    }

    const artY = () => artSec.offsetTop;
    const inHub = () => scrollY < artY() - 4;
    const atArtTop = () => Math.abs(scrollY - artY()) <= 4;

    addEventListener('wheel', e => {
      if (!lb.hidden || e.ctrlKey) return;
      if (gliding) { e.preventDefault(); return; }
      if (e.deltaY > 0 && inHub()) { e.preventDefault(); glideTo(artY()); }
      else if (e.deltaY < 0 && (atArtTop() || (scrollY < artY() && scrollY > 0))) { e.preventDefault(); glideTo(0); }
    }, { passive: false });

    addEventListener('keydown', e => {
      if (!lb.hidden || e.target.closest('input, button')) return;
      const down = ['ArrowDown', 'PageDown', ' '].includes(e.key) && !e.shiftKey;
      const up = ['ArrowUp', 'PageUp'].includes(e.key) || (e.key === ' ' && e.shiftKey);
      if (down && inHub()) { e.preventDefault(); glideTo(artY()); }
      else if (up && (atArtTop() || inHub())) { e.preventDefault(); glideTo(0); }
    });

    document.querySelectorAll('a[href="#art"], a[href="#top"]').forEach(a =>
      a.addEventListener('click', e => { e.preventDefault(); glideTo(a.hash === '#art' ? artY() : 0); }));

    // Keep the label honest if YouTube changes mute state on its own.
    setInterval(update, 1000);
  </script>
